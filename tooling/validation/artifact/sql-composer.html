<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>SQL Composer (deterministic)</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
  :root{--bg:#0f1420;--panel:#171e2e;--line:#2a3550;--txt:#dfe6f2;--muted:#8a96b0;--chip:#0d1322;
        --accent:#3a63c0;--ok:#4fb477;--warn:#e0a13a;--bad:#e0673a;
        --additive:#3aa0e0;--snapshot:#8a7bd8;--first:#4fb477;}
  *{box-sizing:border-box}
  body{margin:0;font:13px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column}
  header{padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  header b{font-size:14px}header .sub{color:var(--muted);font-size:12px}
  select,input,button{background:var(--chip);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
  select:focus{outline:1px solid var(--accent)} button{cursor:pointer}
  button.primary{background:#274690;border-color:var(--accent)}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:6px 10px}.seg button.on{background:#274690}
  label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
  #det{margin-left:auto;color:var(--muted);font-size:11px}
  #main{flex:1;display:flex;min-height:0}
  #left{flex:1;min-width:0;display:flex;flex-direction:column}
  .vbar{margin:10px 14px 0;padding:9px 12px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;display:none}
  .vbar.show{display:block}.vbar.ok{background:#12301f;border-color:#245c3a;color:#a6e6c0}
  .vbar.warn{background:#332611;border-color:#5a4212;color:#ffd98a}.vbar.bad{background:#33150f;border-color:#5c2418;color:#ffb4a0}
  #sqlwrap{flex:1;margin:10px 14px 14px;border:1px solid var(--line);border-radius:8px;background:#0b101c;overflow:auto;position:relative}
  #tools{position:sticky;top:0;display:flex;gap:8px;justify-content:flex-end;padding:8px;background:linear-gradient(#0b101cdd,#0b101c00)}
  #sql{margin:0;padding:6px 14px 16px;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre;color:#cdd8ef}
  #sql .c{color:#5f6b86}#sql .ok{color:#79d19b}#sql .warn{color:#e7b45a}#sql .kw{color:#7fa6ff}#sql .todo{color:#e58f7a}
  #side{width:330px;border-left:1px solid var(--line);background:var(--panel);padding:12px;overflow:auto}
  #side h3{margin:12px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}#side h3:first-child{margin-top:0}
  code{background:var(--chip);padding:1px 5px;border-radius:4px;color:#b9c6e6;font-size:12px}
  .badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;color:#0d1322}
  .badge.majority{background:var(--ok)}.badge.outlier{background:var(--warn)}.badge.noop{background:var(--bad)}
  .badge.additive{background:var(--additive)}.badge.snapshot{background:var(--snapshot)}.badge.first{background:var(--first)}
  .mrow{display:flex;justify-content:space-between;gap:8px;margin:3px 0;align-items:center}
  .pill{display:inline-block;padding:1px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted);font-size:11px;margin:2px 4px 2px 0}
  .crit{background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:4px 0;font:12px ui-monospace,monospace;color:#b9c6e6;word-break:break-all}
  .hint{color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<header>
  <b>SQL Composer</b><span class="sub" id="clienttag"></span>
  <label class="f">screen<select id="screen"></select></label>
  <label class="f">view<select id="view" style="min-width:220px"></select></label>
  <label class="f">grain (aggBy)<select id="grain"></select></label>
  <label class="f">criteria<div class="seg" id="crit"><button data-c="hist" class="on">HIST</button><button data-c="flow">FLOW</button></div></label>
  <span id="det"></span>
</header>
<div id="main">
  <div id="left">
    <div class="vbar" id="vbar"></div>
    <div id="sqlwrap"><div id="tools"><button id="copy">Copy SQL</button></div>
      <pre id="sql"><span class="c">-- Pick a screen → view. This composes a ClickHouse-correct, consistency-annotated

  <div id="side"><h3>Pivot contract</h3><div id="contract"><div class="hint">Select a view.</div></div></div>

const $=id=>document.getElementById(id);
const PROD_LEVEL_COL={stylecolor:'product', style:'x_style'};
const FIXED_DIMS=new Set(['location','time','merchcat','grade','prodlife','cluster']);
const GRAINS=['stylecolor','style','class','subclass','department'];
const CORE=['dmd_u','shp_u','ret_u','dmd_r','shp_r','eoh_u','boh_u'];
let S={screen:null,view:null,pivot:null,grain:'stylecolor',crit:'hist'};

// ---- deterministic composer (port of compose.py) ----
function chExpr(m,maggs){const i=maggs&&maggs[m];return i?i.ch_expr:`sum(${m})`;}
function compose(){
  const c=CAT.pivots[S.pivot]; if(!c){$('sql').textContent='-- no contract for '+S.pivot;return;}
  const table=c.base||'trd_p_history_agg', maggs=c.metric_aggs||{};
  const crit = S.crit==='hist'? c.hist : c.flow;
  const col=PROD_LEVEL_COL[S.grain];
  const warnings=[], group=[], dims=[];
  if(col){group.push(col);dims.push(`${col} AS ${S.grain}`);}
  else{group.push('product');dims.push('product AS stylecolor');
    warnings.push(`grain '${S.grain}' is not a direct column on ${table} — needs a product-hierarchy join (M_Meta); grouping at stylecolor.`);}
  const show=CORE.filter(m=>maggs[m]);
  const L=[];
  L.push('-- ============================================================');
  L.push('-- VALIDATION QUERY (independent oracle) — composed in-browser, deterministic');
  L.push(`-- pivot        : ${S.pivot}`);
  L.push(`-- grain (aggBy): level:${S.grain}`);
  L.push(`-- source view  : ${table}   (temp tables bypassed by design)`);
  L.push(`-- criteria     : ${S.crit.toUpperCase()}: ${crit||'(none)'}`);
  L.push('-- CH DIALECT   : `time` is a String week id → filter with IN (not a date BETWEEN).');
  L.push('--   additive→sum(); snapshot→argMax(m,time) (EOH); first→argMin(m,time) (BOH) — NOT sum.');
  warnings.forEach(w=>L.push('-- TODO/CONFIRM : '+w));
  L.push('-- BEFORE RUN   : set :HISTORY_WEEKS to the UI’s history window (string week ids).');
  L.push('');
  const items=dims.map(d=>[d,null])
    .concat(show.map(m=>[`${chExpr(m,maggs)} AS ${m}`, (maggs[m]||{}).family]));
  items.push(['count(DISTINCT product) AS stylecolor_count','choice count (exact in CH)']);
  L.push('SELECT');
  items.forEach((it,i)=>{const comma=i<items.length-1?',':'';L.push(`    ${it[0]}${comma}`+(it[1]?`   -- ${it[1]}`:''));});
  L.push(`FROM ${table}`);
  L.push('WHERE time IN (:HISTORY_WEEKS)               -- REQUIRED: string week ids from the UI');
  L.push(`GROUP BY ${group.join(', ')}`);
  if(crit) L.push(`HAVING ${crit}`);
  L.push(...consistencyBanner(S.pivot));
  L.push(`ORDER BY ${group.join(', ')}`);
  L.push(';');
  renderSQL(L.join('\n'));
}
function consistencyBanner(pivot){
  const co=CAT.consistency[pivot];
  if(!co) return ['-- consistency: no verdict (not in catalog).'];
  if(co.verdict==='noop'){
    const out=['-- ⚠ CONSISTENCY: this pivot’s criteria is a NO-OP → rows are UNFILTERED.',
      `--   criteria as written: ${co.hist||'(see HAVING)'}`];
    if(co.base&&co.majority_hist) out.push(`--   ${co.n_siblings} sibling pivots on ${co.base} filter at: ${co.majority_hist}`);
    else out.push('--   reads a derived (nested) source; cross-check against HistoryFit.');
    return out;
  }
  if(co.verdict==='outlier') return ['-- ⚠ CONSISTENCY: criteria DIFFERS from its base-mates.',
    `--   this pivot: ${co.hist}`,`--   majority (${co.n_siblings}) on ${co.base}: ${co.majority_hist}`,
    '--   counts may not reconcile across views (SUP-4486 class).'];
  return [`-- ✓ CONSISTENCY: matches the majority (${co.n_siblings} pivots) on ${co.base}.`];
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const KW=/\b(SELECT|FROM|WHERE|GROUP BY|HAVING|ORDER BY|AND|OR|AS|DISTINCT|IN)\b/g;
function renderSQL(sql){
  $('sql').innerHTML=sql.split('\n').map(l=>{const t=l.trim();
    if(t.startsWith('-- ✓')) return `<span class="ok">${esc(l)}</span>`;
    if(t.startsWith('-- ⚠')) return `<span class="warn">${esc(l)}</span>`;
    if(t.includes('TODO')||t.includes('CONFIRM')) return `<span class="todo">${esc(l)}</span>`;
    if(t.startsWith('--')) return `<span class="c">${esc(l)}</span>`;
    return esc(l).replace(KW,'<span class="kw">$1</span>');}).join('\n');
}
// ---- contract panel + verdict bar ----
function contract(){
  const c=CAT.pivots[S.pivot], co=CAT.consistency[S.pivot]||{}, aggs=(c&&c.metric_aggs)||{};
  const mrows=Object.keys(aggs).sort().map(m=>`<div class="mrow"><code>${m}</code><span class="badge ${aggs[m].family}">${aggs[m].family}</span></div>`).join('')||'<div class="hint">—</div>';
  const grain=(c&&c.grain||[]).map(g=>`<span class="pill">${g}</span>`).join('')||'—';
  $('contract').innerHTML=`<div><b>${S.pivot}</b> ${co.verdict?`<span class="badge ${co.verdict}">${co.verdict}</span>`:''}</div>
    <div style="margin-top:4px">base: <code>${(c&&c.base)||'(derived)'}</code></div>
    <h3>Grain</h3><div>${grain}</div>
    <h3>Per-metric aggregation (CH)</h3>${mrows}
    <h3>Criteria</h3><div class="crit">HIST: ${(c&&c.hist)||'—'}</div><div class="crit">FLOW: ${(c&&c.flow)||'—'}</div>`;
  const vb=$('vbar');
  if(co.verdict==='majority'){vb.className='vbar show ok';vb.innerHTML=`✓ Consistent — matches the majority (${co.n_siblings}) on <code>${co.base}</code>.`;}
  else if(co.verdict==='outlier'){vb.className='vbar show warn';vb.innerHTML=`⚠ Outlier — criteria differs from ${co.n_siblings} base-mates on <code>${co.base}</code>.`;}
  else if(co.verdict==='noop'){vb.className='vbar show bad';vb.innerHTML='⚠ No-op criteria — filtering effectively disabled; rows unfiltered.';}
  else vb.className='vbar';
}
// ---- pickers ----
let VIEWS=[];
function screens(){return [...new Set(CAT.view_index.map(v=>v.screen))].sort();}
function init(){
  $('clienttag').textContent=`${CAT.client} · ${CAT.module} · ${Object.keys(CAT.pivots).length} pivots`;
  $('grain').innerHTML=GRAINS.map(g=>`<option ${g==='stylecolor'?'selected':''}>${g}</option>`).join('');
  $('screen').innerHTML=screens().map(s=>`<option>${s}</option>`).join('');
  $('screen').onchange=e=>{S.screen=e.target.value;loadViews();};
  $('view').onchange=e=>pick(+e.target.value);
  $('grain').onchange=e=>{S.grain=e.target.value;if(S.pivot)go();};
  $('crit').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.crit=b.dataset.c;
    $('crit').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));if(S.pivot)go();});
  $('copy').onclick=()=>{navigator.clipboard.writeText($('sql').textContent);$('copy').textContent='Copied ✓';setTimeout(()=>$('copy').textContent='Copy SQL',1200);};
  S.screen=screens()[0]; $('screen').value=S.screen; loadViews();
}
function loadViews(){
  VIEWS=CAT.view_index.filter(v=>v.screen===S.screen);
  const mark=v=>{const c=CAT.consistency[v.pivot];return c&&(c.verdict==='noop'||c.verdict==='outlier')?' ⚠':'';};
  $('view').innerHTML=VIEWS.map((v,i)=>`<option value="${i}">${v.view}${mark(v)}${v.pivot?'':' (no pivot)'}</option>`).join('');
  if(VIEWS.length) pick(0);
}
function pick(i){const v=VIEWS[i];if(!v)return;S.view=v.view;S.pivot=v.pivot;
  if(!v.pivot){$('contract').innerHTML='<div class="hint">Presentation-only view (no pivot).</div>';$('sql').textContent='';$('vbar').className='vbar';return;}
  go();}
function go(){contract();compose();$('det').textContent=`${S.pivot} @ ${S.grain} · ${S.crit}`;}
init();
</script>
</body>
</html>
